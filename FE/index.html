<!doctype html>
<!--
  `class="dark"` is load-bearing, not decorative.

  themes.css defines every text token twice: a light value in @theme and a dark override under
  `.dark`. Nothing was applying that class, so a UI whose backgrounds are hardcoded dark was
  resolving --color-text-primary to neutral-900 — near-black text on a near-black card. Result
  titles were literally unreadable.

  `lang` is "vi" because the interface is Vietnamese; the few English strings that come back from
  the API carry their own lang attribute.
-->
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>SceneSearch — tìm kiếm cảnh lái xe</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
