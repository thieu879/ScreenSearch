[pytest]
testpaths = tests
asyncio_mode = strict

# `slow` covers tests that download or load a model (hundreds of MB, tens of seconds). They are
# excluded by default so `make test` and CI stay fast, and run explicitly with:
#     pytest -m slow
# The fast suite still pins the full query path, because the encoder's output is committed as a
# fixture — see tests/test_services/test_fidelity.py for why that split exists.
markers =
    slow: needs a model download; excluded from the default run
addopts = -m "not slow"
